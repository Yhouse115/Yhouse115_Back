name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "chore/**"
      - "feature/**"

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t whyhouse-backend:ci .
