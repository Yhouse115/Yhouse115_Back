name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "chore/**"
      - "feature/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      database:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: whyhouse
          POSTGRES_USER: whyhouse
          POSTGRES_PASSWORD: whyhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Database DDL Migrations
        env:
          DATABASE_URL: postgresql://whyhouse:whyhouse@localhost:5432/whyhouse
        run: |
          python -c "
          import asyncio, asyncpg, os
          async def init():
              conn = await asyncpg.connect('postgresql://whyhouse:whyhouse@localhost:5432/whyhouse')
              sql_files = sorted([f for f in os.listdir('supabase/migrations') if f.endswith('.sql')])
              for f in sql_files:
                  with open(os.path.join('supabase/migrations', f), 'r') as s:
                      await conn.execute(s.read())
              await conn.close()
          asyncio.run(init())
          "

      - name: Run tests
        env:
          DATABASE_URL: postgresql://whyhouse:whyhouse@localhost:5432/whyhouse
        run: pytest

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t whyhouse-backend:ci .
