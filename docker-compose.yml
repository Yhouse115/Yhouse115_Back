services:
  database:
    image: postgis/postgis:16-3.4
    container_name: whyhouse-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whyhouse}
      POSTGRES_USER: ${POSTGRES_USER:-whyhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whyhouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - whyhouse-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whyhouse} -d ${POSTGRES_DB:-whyhouse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - whyhouse

  backend:
    build:
      context: .
    container_name: whyhouse-backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-WhyHouse Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://whyhouse:whyhouse@database:5432/whyhouse}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_NAVER_MAPS_CLIENT_ID: ${VITE_NAVER_MAPS_CLIENT_ID:-}
      NAVER_MAPS_CLIENT_SECRET: ${NAVER_MAPS_CLIENT_SECRET:-}
      NAVER_MAPS_GEOCODE_BASE_URL: ${NAVER_MAPS_GEOCODE_BASE_URL:-https://maps.apigw.ntruss.com/map-geocode/v2}
      NAVER_MAPS_REVERSE_GEOCODE_BASE_URL: ${NAVER_MAPS_REVERSE_GEOCODE_BASE_URL:-https://maps.apigw.ntruss.com/map-reversegeocode/v2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - whyhouse

  frontend:
    image: node:22-alpine
    container_name: whyhouse-frontend
    working_dir: /app
    command: >
      sh -c "if [ -f package.json ]; then
      npm install && ${FRONTEND_COMMAND:-npm run dev -- --host 0.0.0.0};
      else
      echo 'Frontend project is not initialized at ../Yhouse115_Front. Add package.json to run it.';
      sleep infinity;
      fi"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../Yhouse115_Front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-WhyHouse Front}
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_NAVER_MAPS_CLIENT_ID: ${VITE_NAVER_MAPS_CLIENT_ID:-}
      VITE_NAVER_MAPS_DEFAULT_STYLE_ID: ${VITE_NAVER_MAPS_DEFAULT_STYLE_ID:-}
      VITE_NAVER_MAPS_TRANSIT_STYLE_ID: ${VITE_NAVER_MAPS_TRANSIT_STYLE_ID:-}
      VITE_NAVER_MAPS_SOFT_STYLE_ID: ${VITE_NAVER_MAPS_SOFT_STYLE_ID:-}
      VITE_NAVER_MAPS_NO_TRANSIT_STYLE_ID: ${VITE_NAVER_MAPS_NO_TRANSIT_STYLE_ID:-}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend
    networks:
      - whyhouse

networks:
  whyhouse:
    name: whyhouse-network

volumes:
  frontend_node_modules:
  whyhouse-postgres-data:
